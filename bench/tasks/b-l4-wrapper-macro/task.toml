schema_version = "1.1"

[task]
name = "bench/b-l4-wrapper-macro"
description = "Repair a Blade wrapper macro used across many packages"

[metadata]
track = "B"
level = "L"
tags = ["single", "blade-L4"]

[bench]
capsule = "toolchains"
net = "none"
gpu = false

[verifier]
command = "sh tests/verify.sh"
timeout_sec = 300
protected = ["tests", "app/main.cc", "config/config.cc", "config/config.h", "feature/p0/part0.cc", "feature/p0/part0.h", "feature/p1/part1.cc", "feature/p1/part1.h", "feature/p2/part2.cc", "feature/p2/part2.h", "feature/p3/part3.cc", "feature/p3/part3.h", "feature/p4/part4.cc", "feature/p4/part4.h", "feature/p5/part5.cc", "feature/p5/part5.h"]

[agent]
timeout_sec = 900
