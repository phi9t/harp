schema_version = "1.1"

[task]
name = "bench/mh1-py-inventory"
description = "Hard multi-ticket Python inventory and order-fulfilment library"

[metadata]
track = "P"
level = "M"
tags = ["multi"]

[bench]
capsule = "toolchains"
net = "none"
gpu = false

[multi]
expected_conflicts = 1
expected_landing = "tickets t3-pricing and t5-reports both append exports to inventory/__init__.py from the same base; whichever lands second conflicts, then redo composes the exports"

[verifier]
command = "python3 -m unittest discover -s tests"
timeout_sec = 120
protected = ["tests"]

[agent]
timeout_sec = 900
