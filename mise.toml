run = "scripts/check_lean_library.sh all"

[tasks.lean-timing]
description = "Print timing reports for the shared Lean root and focused proof targets"
run = """
set -euo pipefail
mise run lean-all
mise run lean-training
mise run lean-foundations
mise run lean-nng4
mise run lean-autodiff
mise run lean-crouzeix
"""

[tasks.verify-lean]
description = "Build the pinned Training Dynamics Lean formalization"
run = "mise run lean-training"

[tasks.verify-mathematical-foundations-lean]
description = "Build the pinned Mathematical Foundations Lean formalization"
run = "mise run lean-foundations"

[tasks.verify-nng4-intro-lean]
description = "Build the pinned NNG4 introductory Lean formalization"
run = "mise run lean-nng4"

[tasks.verify-autodiff-geometry-lean]
description = "Build the pinned Autodiff Geometry Lean formalization"
run = "mise run lean-autodiff"

[tasks.verify-repository]
description = "Verify import map, LFS, forbidden references, and generated cleanliness"
run = """
set -euo pipefail
git lfs fsck
mise run build
"$HARP_TARGET_DIR/size/harp" repository verify
"""

[tasks.verify]
description = "Provider-neutral Harp release gate"
run = "mise run verify-atlas && mise run verify-rust && mise run lean-all && mise run verify-repository"
