[tools]
node = "22.22.3"
rust = "1.92.0"
git-lfs = "3.8.0"

[env]
HARP_TARGET_DIR = "{{config_root}}/.build/harp-target"
HARP_INPROCESS_TARGET_DIR = "{{config_root}}/.build/codex-inprocess-target"
CARGO_INCREMENTAL = "0"

[tasks.bootstrap]
description = "Install locked repository dependencies and local Git LFS filters"
run = """
set -euo pipefail
git lfs install --local
cargo fetch --locked
cd atlas
corepack pnpm install --frozen-lockfile
"""

[tasks.test]
description = "Run workspace tests with the compact test profile"
run = '''
set -euo pipefail
# Context-control tests create disposable Git repositories. They must not inherit
# a host-managed hooksPath through Git's command-line configuration environment.
unset GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS
unset TRAE_GIT_ATTRIBUTION_CONFIG_SLOT TRAE_GIT_ATTRIBUTION_HELPER
unset TRAE_GIT_ATTRIBUTION_MANAGED_HOOK
unset TRAE_GIT_ATTRIBUTION_ORIGINAL_CONFIG_PARAMETERS
unset TRAE_GIT_ATTRIBUTION_ORIGINAL_CONFIG_PARAMETERS_PRESENT
index=0
while [ "$index" -lt 32 ]; do
  unset "GIT_CONFIG_KEY_$index" "GIT_CONFIG_VALUE_$index"
  index=$((index + 1))
done
CARGO_TARGET_DIR="$HARP_TARGET_DIR" cargo test --profile test-small --workspace
'''

[tasks.test-shell]
description = "Run compact build-policy shell regressions"
run = """
set -euo pipefail
scripts/test_clean_build.sh
scripts/test_check_no_dwarf.sh
sh scripts/test_harp_xdg_env.sh
sh scripts/test_lean_task_graph.sh
python3 -m unittest discover -s scripts/tests -p test_release_candidate.py -v
python3 -m unittest discover -s scripts/tests -p test_prepare_pages.py -v
python3 -m unittest discover -s scripts/tests -p test_textbook_publication_task.py -v
"""

[tasks.fmt]
description = "Check Rust formatting without creating build artifacts"
run = 'cargo fmt --all --check'

[tasks.clippy]
description = "Lint all Rust targets with the compact test profile"
run = 'CARGO_TARGET_DIR="$HARP_TARGET_DIR" cargo clippy --profile test-small --workspace --all-targets -- -D warnings'

[tasks.build]
description = "Build the stripped Harp executable with the size profile"
run = 'CARGO_TARGET_DIR="$HARP_TARGET_DIR" cargo build --profile size -p harp'

[tasks.no-dwarf]
description = "Reject dSYM output and embedded DWARF in the size-profile executable"
depends = ["build"]
run = 'scripts/check_no_dwarf.sh "$HARP_TARGET_DIR/size/harp"'

[tasks.clean-build]
description = "Remove only configured worktree-local Rust target directories"
run = 'scripts/clean_build.sh "{{config_root}}" "$HARP_TARGET_DIR" "$HARP_INPROCESS_TARGET_DIR"'

[tasks.verify-rust]
description = "Run Rust formatting, linting, tests, corpus, search, and source gates"
run = """
set -euo pipefail
mise run fmt
mise run clippy
mise run test
mise run test-shell
mise run no-dwarf
"$HARP_TARGET_DIR/size/harp" check
"$HARP_TARGET_DIR/size/harp" build --check
"$HARP_TARGET_DIR/size/harp" sources verify
"$HARP_TARGET_DIR/size/harp" search refresh
"$HARP_TARGET_DIR/size/harp" search status
"$HARP_TARGET_DIR/size/harp" search query "recursive improvement" --limit 5 >/dev/null
python3 -m unittest discover -s labs/meta_harness_trae/tests -v
python3 -m unittest discover -s labs/crouzeix_proof_reproduction/tests -v
"""

[tasks.verify-atlas]
description = "Run Atlas lint, types, tests, production build, and decoded export test"
depends = ["crouzeix-textbook-publication"]
run = """
set -euo pipefail
config_root="{{config_root}}"
atlas_dir="$config_root/atlas"
"$config_root/scripts/check_atlas_dependencies.sh" "$atlas_dir"
mise run build
(
  cd "$config_root"
  "$HARP_TARGET_DIR/size/harp" build
  "$HARP_TARGET_DIR/size/harp" build --check
)
(
  cd "$atlas_dir"
  "$atlas_dir/node_modules/.bin/eslint" . --ignore-pattern dist --ignore-pattern target
  "$atlas_dir/node_modules/.bin/tsc" -b
  "$atlas_dir/node_modules/.bin/vitest" run --configLoader runner --no-cache
  "$atlas_dir/node_modules/.bin/tsc" -b
  "$atlas_dir/node_modules/.bin/vite" build --configLoader runner
  node scripts/export-static.mjs
  node tests/static-export.test.mjs
)
"""

[tasks.lean-env]
description = "Prepare task-scoped Lean environment variables for shared-root proof builds"
run = """
set -euo pipefail
. scripts/harp_xdg_env.sh
test "$(tr -d '\r\n' < formalization/lean/lean-toolchain)" = "$HARP_LEAN_TOOLCHAIN"
test -d "$HARP_LEAN_CACHE_ROOT" && test ! -L "$HARP_LEAN_CACHE_ROOT"
test -d "$HARP_ELAN_HOME" && test ! -L "$HARP_ELAN_HOME"
test -d "$HARP_LEAN_TOOLCHAIN_ROOT" && test ! -L "$HARP_LEAN_TOOLCHAIN_ROOT"
test -d "$HARP_LEAN_TOOLCHAIN_BIN" && test ! -L "$HARP_LEAN_TOOLCHAIN_BIN"
test -x "$HARP_LEAN_TOOLCHAIN_BIN/lake"
test -x "$HARP_LEAN_TOOLCHAIN_BIN/lean"
git_common_dir=$(git rev-parse --path-format=absolute --git-common-dir)
case "$git_common_dir" in */.git) primary=${git_common_dir%/.git} ;; *) exit 1 ;; esac
config_root="{{config_root}}"
if [ "$config_root" = "$primary" ]; then
  test -d formalization/lean/.lake
  test ! -L formalization/lean/.lake
else
  test -L formalization/lean/.lake
  test "$(readlink formalization/lean/.lake)" = "$primary/formalization/lean/.lake"
fi
test -L "$primary/formalization/lean/.lake/packages"
test "$(readlink "$primary/formalization/lean/.lake/packages")" = "$HARP_LEAN_CACHE_ROOT/packages"
test -d "$HARP_LEAN_CACHE_ROOT/packages/mathlib"
test ! -L "$HARP_LEAN_CACHE_ROOT/packages/mathlib"
"""

[tasks.lean-cache]
description = "Explicitly hydrate the shared Lean/mathlib cache before proof verification"
depends = ["lean-env"]
run = """
set -euo pipefail
. scripts/harp_xdg_env.sh
export ELAN_HOME="$HARP_ELAN_HOME"
export PATH="$HARP_LEAN_TOOLCHAIN_BIN:$PATH"
cd formalization/lean
lake --try-cache exe cache get Mathlib
"""

[tasks.lean-training]
description = "Build the Training Dynamics Lean library from the shared Lake root"
depends = ["lean-env"]
run = '''. scripts/harp_xdg_env.sh; export ELAN_HOME="$HARP_ELAN_HOME"; export PATH="$HARP_LEAN_TOOLCHAIN_BIN:$PATH"; scripts/check_lean_library.sh TrainingDynamics'''

[tasks.lean-foundations]
description = "Build the Mathematical Foundations Lean library from the shared Lake root"
depends = ["lean-env"]
run = '''. scripts/harp_xdg_env.sh; export ELAN_HOME="$HARP_ELAN_HOME"; export PATH="$HARP_LEAN_TOOLCHAIN_BIN:$PATH"; scripts/check_lean_library.sh MathematicalFoundations'''

[tasks.lean-cauchy-audit]
description = "Run trusted Cauchy-Schwarz dependency-policy regression fixtures"
depends = ["lean-foundations"]
run = "sh scripts/check_cauchy_schwarz_audit.sh"

[tasks.lean-nng4]
description = "Build the NNG4 introductory Lean library from the shared Lake root"
depends = ["lean-env"]
run = '''. scripts/harp_xdg_env.sh; export ELAN_HOME="$HARP_ELAN_HOME"; export PATH="$HARP_LEAN_TOOLCHAIN_BIN:$PATH"; scripts/check_lean_library.sh NNG4Intro'''

[tasks.lean-autodiff]
description = "Build the Autodiff Geometry Lean library from the shared Lake root"
depends = ["lean-env"]
run = '''. scripts/harp_xdg_env.sh; export ELAN_HOME="$HARP_ELAN_HOME"; export PATH="$HARP_LEAN_TOOLCHAIN_BIN:$PATH"; scripts/check_lean_library.sh AutodiffGeometry'''

[tasks.lean-crouzeix]
description = "Build the Crouzeix Lean library from the shared Lake root"
depends = ["lean-env"]
run = '''. scripts/harp_xdg_env.sh; export ELAN_HOME="$HARP_ELAN_HOME"; export PATH="$HARP_LEAN_TOOLCHAIN_BIN:$PATH"; scripts/check_lean_library.sh Crouzeix'''

[tasks.lean-crouzeix-textbook]
description = "Build the Crouzeix textbook Lean library from the shared Lake root"
depends = ["lean-env"]
run = '''. scripts/harp_xdg_env.sh; export ELAN_HOME="$HARP_ELAN_HOME"; export PATH="$HARP_LEAN_TOOLCHAIN_BIN:$PATH"; scripts/check_lean_library.sh CrouzeixTextbook'''

[tasks.crouzeix-textbook-publication]
description = "Compile a fresh textbook receipt, then publish and check the Rust-owned ledgers"
depends = ["lean-env", "build"]
run = """
set -euo pipefail
textbook_harp_binary="$HARP_TARGET_DIR/size/harp"
. scripts/harp_xdg_env.sh
export ELAN_HOME="$HARP_ELAN_HOME"
export PATH="$HARP_LEAN_TOOLCHAIN_BIN:$PATH"
umask 077
receipt_dir=$(mktemp -d "${TMPDIR:-/tmp}/harp-crouzeix-textbook-receipt.XXXXXX")
receipt_path="$receipt_dir/receipt.json"
cleanup() {
  rm -f -- "$receipt_path"
  rmdir -- "$receipt_dir"
}
trap cleanup EXIT
scripts/check_lean_library.sh CrouzeixTextbook --receipt-output "$receipt_path"
"$textbook_harp_binary" crouzeix-textbook publish --receipt "$receipt_path"
"$textbook_harp_binary" crouzeix-textbook check --receipt "$receipt_path"
"""

[tasks.lean-crouzeix-jin]
description = "Build the route-isolated Jin Crouzeix Lean library from the shared Lake root"
depends = ["lean-env"]
run = '''. scripts/harp_xdg_env.sh; export ELAN_HOME="$HARP_ELAN_HOME"; export PATH="$HARP_LEAN_TOOLCHAIN_BIN:$PATH"; scripts/check_lean_library.sh CrouzeixJin'''

[tasks.lean-crouzeix-ls]
description = "Build the route-isolated Lorist-Schwenninger Crouzeix Lean library from the shared Lake root"
depends = ["lean-env"]
run = '''. scripts/harp_xdg_env.sh; export ELAN_HOME="$HARP_ELAN_HOME"; export PATH="$HARP_LEAN_TOOLCHAIN_BIN:$PATH"; scripts/check_lean_library.sh CrouzeixLoristSchwenninger'''

[tasks.lean-crouzeix-harp]
description = "Build the route-isolated Harp Crouzeix Lean library from the shared Lake root"
depends = ["lean-env"]
run = '''. scripts/harp_xdg_env.sh; export ELAN_HOME="$HARP_ELAN_HOME"; export PATH="$HARP_LEAN_TOOLCHAIN_BIN:$PATH"; scripts/check_lean_library.sh CrouzeixHarp'''

[tasks.lean-all]
description = "Build all Harp Lean libraries once from the shared Lake root"
depends = ["lean-env"]
run = '''. scripts/harp_xdg_env.sh; export ELAN_HOME="$HARP_ELAN_HOME"; export PATH="$HARP_LEAN_TOOLCHAIN_BIN:$PATH"; scripts/check_lean_library.sh all'''

[tasks.lean-timing]
description = "Print timing reports for the shared Lean root and focused proof targets"
run = """
set -euo pipefail
mise run lean-all
mise run lean-training
mise run lean-foundations
mise run lean-nng4
mise run lean-autodiff
mise run lean-crouzeix
mise run lean-crouzeix-textbook
"""

[tasks.verify-lean]
description = "Build the pinned Training Dynamics Lean formalization"
run = "mise run lean-training"

[tasks.verify-mathematical-foundations-lean]
description = "Build the pinned Mathematical Foundations Lean formalization"
run = "mise run lean-foundations"

[tasks.verify-nng4-intro-lean]
description = "Build the pinned NNG4 introductory Lean formalization"
run = "mise run lean-nng4"

[tasks.verify-autodiff-geometry-lean]
description = "Build the pinned Autodiff Geometry Lean formalization"
run = "mise run lean-autodiff"

[tasks.verify-repository]
description = "Verify import map, LFS, forbidden references, and generated cleanliness"
run = """
set -euo pipefail
git lfs fsck
mise run build
"$HARP_TARGET_DIR/size/harp" repository verify
"""

[tasks.verify]
description = "Provider-neutral Harp release gate"
run = "mise run verify-atlas && mise run verify-rust && mise run lean-all && sh scripts/check_cauchy_schwarz_audit.sh && mise run verify-repository"

[tasks.release-candidate]
description = "Verify, package, and smoke-test a clean native release candidate"
run = "python3 scripts/release_candidate.py"
