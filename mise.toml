depends = ["lean-env"]
env = { ELAN_HOME = "/private/tmp/harp-mathematical-foundations-elan", PATH = "/private/tmp/harp-mathematical-foundations-elan/toolchains/leanprover--lean4---v4.32.1/bin:{{env.PATH}}" }
