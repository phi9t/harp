name: Durable backend qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: durable-qualification
    runs-on: [self-hosted, linux, corenius-durable]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - name: Qualify both backends without skips
        run: |
          python3 tools/temp_root.py -- python3 -m controller.durable.qualify --user-scope --output ".scratch/qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-qualification
          path: .scratch/qualification-*.json
          include-hidden-files: true
          if-no-files-found: error
