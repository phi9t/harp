name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tools
        run: |
          python3 tools/temp_root.py -- sudo --preserve-env=TMPDIR,TMP,TEMP apt-get update
          python3 tools/temp_root.py -- sudo --preserve-env=TMPDIR,TMP,TEMP apt-get install -y bubblewrap tmux
          python3 tools/temp_root.py -- sudo --preserve-env=TMPDIR,TMP,TEMP sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 tools/temp_root.py -- rustup toolchain install 1.95.0 --profile minimal
          python3 tools/temp_root.py -- rustup default 1.95.0
          python3 tools/temp_root.py -- cargo fetch --locked
      - name: Run the repository gate
        env:
          CHECK_CONTROLLER_THREADS: '4'
        run: python3 tools/temp_root.py -- sh tools/agents/check.sh --json .scratch/ci/check.json
      - name: Retain check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-checks
          path: .scratch/ci/check.json
          include-hidden-files: true
          if-no-files-found: warn
