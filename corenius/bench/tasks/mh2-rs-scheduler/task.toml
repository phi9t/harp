schema_version = "1.1"

[task]
name = "bench/mh2-rs-scheduler"
description = "Multi-ticket Rust job scheduler with graph, queue, retry, calendar and reporting"

[metadata]
track = "R"
level = "M"
tags = ["multi", "rust"]

[bench]
capsule = "toolchains"
net = "none"
gpu = false

[multi]
expected_conflicts = 1
expected_landing = "t1-graph and t2-queue both update the implemented component registry line in src/lib.rs from the same base; the second one conflicts, then redo merges the registry in canonical order"

[verifier]
command = "sh tests/verify.sh"
timeout_sec = 300

[verifier.env]

[agent]
timeout_sec = 900
