[package]
name = "corenius-sqlite-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
fault-injection = []

[dependencies]
rusqlite = { version = "=0.38.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "=0.10.6"
base64 = "=0.22.1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
