[workspace]
members = [
    "crates/harp",
    "crates/harp-cli-process",
    "crates/harp-cli-test-support",
    "crates/harp-artifacts",
    "crates/harp-contracts",
    "crates/harp-engine",
    "crates/harp-runtime",
    "crates/harp-state",
    "labs/sicp-evaluator",
]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
assert_cmd = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
predicates = "3"
pulldown-cmark = "0.13.4"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
flate2 = "1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
toml = "0.9"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
walkdir = "2"
zeroize = "1"

[profile.dev]
debug = 0
split-debuginfo = "off"
incremental = false
strip = "symbols"

[profile.test]
debug = 0
split-debuginfo = "off"
incremental = false
strip = "symbols"

[profile.test-small]
inherits = "test"
opt-level = 1
debug = 0
split-debuginfo = "off"
incremental = false
strip = "symbols"

[profile.release]
debug = 0
split-debuginfo = "off"
strip = "symbols"

[profile.size]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 0
split-debuginfo = "off"
incremental = false
strip = "symbols"
