[workspace]
members = ["crates/harp", "labs/sicp-evaluator"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
predicates = "3"
pulldown-cmark = "0.13.4"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
url = "2"
walkdir = "2"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = "symbols"
